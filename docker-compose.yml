version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: strapi-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi123
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ✅ NocoDB Meta database - PostgreSQL (correct format)
      NC_DB: "pg://strapi-postgres:5432?u=strapi&p=strapi123&d=nocodb"
      NC_DB_URL: "postgres://strapi:strapi123@strapi-postgres:5432/strapi"
      NC_AUTH_JWT_SECRET: "your_secure_jwt_secret_key_here_change_this"
    depends_on:
      - postgres
    volumes:
      - nocodb_data:/usr/app/data

volumes:
  postgres_data:
  nocodb_data:
